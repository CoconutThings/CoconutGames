<!DOCTYPE html>
<html>
<head>
  <title>Coconut Games</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<header>
  <h1>Coconut Games</h1>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- Character Customization -->
  <div class="panel">
  <h2>3D Avatar</h2>
  <div id="avatar3d"></div>

  <label>Body Color:</label>
  <input type="color" id="bodyColor" onchange="update3DAvatar()">

  <label>Head Color:</label>
  <input type="color" id="headColor" onchange="update3DAvatar()">
</div>

  <!-- Game Window -->
  <div class="game-window">
    <canvas id="gameCanvas" width="500" height="300"></canvas>
  </div>

  <!-- Video Player -->
  <div class="panel">
    <h2>Video Player</h2>
    <input id="videoURL" placeholder="Paste YouTube embed URL">
    <button onclick="loadVideo()">Load</button>

    <div id="videoContainer"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
